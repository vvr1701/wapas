[project]
name = "wapas"
version = "0.1.0"
description = "AI Revenue Recovery agent — Razorpay AI Buildathon 2026, Track 3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "razorpay>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
